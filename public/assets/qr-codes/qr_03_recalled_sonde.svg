<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580" width="440" height="580" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
        <clipPath id="cardClip">
            <rect x="10" y="10" width="420" height="560" rx="16" ry="16"/>
        </clipPath>
    </defs>

    <!-- Card Background with subtle border -->
    <rect x="10" y="10" width="420" height="560" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)"/>

    <g clip-path="url(#cardClip)">
        <!-- Top Brand Header Bar -->
        <rect x="10" y="10" width="420" height="48" fill="#18181B"/>
        <text x="30" y="40" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="1.5">STERIQORE TRACEABILITY</text>
        <text x="360" y="40" fill="#9CA3AF" font-size="11" font-weight="600">POUCH LABEL</text>

        <!-- Product Information Header -->
        <text x="30" y="85" fill="#111827" font-size="18" font-weight="800">Sonde Parodontale WHO 11.5</text>
        <text x="30" y="108" fill="#6B7280" font-size="12" font-weight="500">Ref: <tspan font-weight="700" fill="#374151">SON-WHO-115</tspan>  |  Lot: <tspan font-weight="700" fill="#374151">LOT-2026-RECALL-9</tspan></text>
        <text x="30" y="128" fill="#6B7280" font-size="12" font-weight="500">Cycle: <tspan font-weight="600" fill="#374151">CYC-2026-078 (Euronda E10)</tspan></text>

        <!-- QR Code Container Box -->
        <rect x="75" y="145" width="290" height="290" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>

        <!-- Embedded QR Code -->
        <g transform="translate(90, 160) scale(1.04)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 23" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h23v23H0z"/><path stroke="#111827" d="M1 1.5h7m1 0h1m5 0h7M1 2.5h1m5 0h1m1 0h1m3 0h1m1 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h3m3 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m2 0h1m2 0h1m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m4 0h2m1 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h7M10 8.5h4M1 9.5h1m2 0h6m1 0h1m1 0h2m2 0h1m1 0h3M1 10.5h1m2 0h2m2 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1M2 11.5h6m1 0h1m5 0h2m3 0h1M1 12.5h1m1 0h3m2 0h2m2 0h1m1 0h1m1 0h3m1 0h2M2 13.5h3m2 0h1m1 0h2m6 0h1m2 0h1M9 14.5h1m1 0h1m1 0h1m2 0h4M1 15.5h7m1 0h2m2 0h1m2 0h2m1 0h2M1 16.5h1m5 0h1m1 0h1m3 0h4m2 0h1m1 0h1M1 17.5h1m1 0h3m1 0h1m1 0h5m1 0h1m3 0h1M1 18.5h1m1 0h3m1 0h1m1 0h5m3 0h1m1 0h1M1 19.5h1m1 0h3m1 0h1m2 0h1m1 0h2m1 0h4m1 0h2M1 20.5h1m5 0h1m4 0h2m1 0h3m2 0h1M1 21.5h7m1 0h1m1 0h1m1 0h2m1 0h2m1 0h2"/></svg>
        </g>

        <!-- QR Code String Label Under Box -->
        <rect x="130" y="445" width="180" height="26" rx="6" fill="#F3F4F6"/>
        <text x="220" y="462" fill="#1F2937" font-size="13" font-weight="700" text-anchor="middle" font-family="monospace">LBL-2026-003-REC</text>

        <!-- Status Bottom Band / Line with Color -->
        <rect x="10" y="490" width="420" height="80" fill="#FEF2F2" stroke="#991B1B" stroke-width="2"/>
        <!-- Accent indicator line right at top of banner -->
        <rect x="10" y="488" width="420" height="6" fill="#DC2626"/>

        <!-- Status Badge & Description -->
        <text x="30" y="522" fill="#DC2626" font-size="15" font-weight="800" letter-spacing="0.5">🚨 RECALLED / LOT RETIRÉ</text>
        <text x="30" y="546" fill="#374151" font-size="11" font-weight="600">Échec de test d'indicateur biologique lors du cycle. Blocage strict avec affichage du motif.</text>
    </g>
</svg>